services:
  bridge:
    build: .
    image: xreal-head-control:latest
    container_name: xreal-bridge
    # host networking: bridge must reach the glasses on the link-local
    # USB-C interface (169.254.2.1) AND the robot's LAN IP. Bridged
    # Docker networks cannot see the host's link-local route.
    network_mode: host
    # raw-mode keyboard input (termios) needs an interactive TTY
    stdin_open: true
    tty: true
    restart: "no"

  # Optional: 3D pygame/OpenGL visualizer. Requires X11 on the host.
  # Run with:  xhost +local:docker  (then docker compose run viz)
  viz:
    build: .
    image: xreal-head-control:latest
    network_mode: host
    stdin_open: true
    tty: true
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    command: ["python3", "head_tracking_3d.py"]
    profiles: ["viz"]
